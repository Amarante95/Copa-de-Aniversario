<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa Jogo Pensado</title>

<!-- PWA: instalar na tela inicial -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Copa Jogo Pensado">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#000000;
    --surface:#141414;
    --gold:#D4AF37;
    --gold-soft:#E9C766;
    --text:#FFFFFF;
    --muted:#AFA99A;
    --line:#4A3F22;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);margin:0;padding:0;}
  body{
    font-family:Calibri,Candara,'Segoe UI',Optima,Arial,sans-serif;
    color:var(--text);
    line-height:1.5;
    padding:16px;
    padding-bottom:60px;
  }
  h1,h2,h3{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700;
    color:var(--gold);
    letter-spacing:.03em;
    margin:0 0 8px 0;
  }
  .cover{text-align:center;margin-bottom:20px;}
  .logo{width:72px;height:auto;display:block;margin:0 auto 6px auto;}
  .brandline{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:18px;}
  .cup-title{
    font-size:clamp(26px,7vw,40px);
    text-transform:uppercase;
    text-align:center;
    border-bottom:1px solid var(--gold);
    padding-bottom:10px;
    margin-bottom:18px;
  }
  .cup-title small{display:block;font-size:14px;color:var(--gold-soft);letter-spacing:.2em;margin-top:4px;}
  .divider{text-align:center;color:var(--gold);letter-spacing:.5em;margin:22px 0;font-size:14px;}
  label{display:block;font-size:13px;color:var(--gold-soft);margin:14px 0 6px 0;font-family:Georgia,serif;text-transform:uppercase;letter-spacing:.04em;}
  input[type=text], select{
    width:100%;
    background:var(--surface);
    border:1px solid var(--gold);
    color:var(--text);
    padding:10px 12px;
    border-radius:6px;
    font-size:16px;
    font-family:Calibri,sans-serif;
  }
  select option{background:#141414;color:#fff;}
  .btn{
    display:inline-block;
    background:var(--gold);
    color:#000;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    font-family:Georgia,serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-size:14px;
    cursor:pointer;
    width:100%;
    margin-top:18px;
  }
  .btn.secondary{
    background:transparent;
    color:var(--gold-soft);
    border:1px solid var(--gold-soft);
  }
  .btn.small{width:auto;padding:8px 14px;font-size:12px;margin-top:0;}
  .team-count-row{display:flex;gap:8px;margin-top:8px;}
  .count-pill{
    flex:1;
    text-align:center;
    padding:10px 0;
    border:1px solid var(--gold);
    border-radius:6px;
    cursor:pointer;
    font-family:Georgia,serif;
    color:var(--gold-soft);
  }
  .count-pill.active{background:var(--gold);color:#000;font-weight:700;}
  .group-label{
    margin-top:18px;
    color:var(--gold);
    font-family:Georgia,serif;
    text-transform:uppercase;
    font-size:13px;
    border-bottom:1px solid var(--line);
    padding-bottom:4px;
  }
  .tabs{display:flex;gap:8px;margin-bottom:18px;position:sticky;top:0;background:#000;padding:10px 0;z-index:5;}
  .tab-btn{
    flex:1;
    text-align:center;
    padding:10px 0;
    border:1px solid var(--gold);
    border-radius:6px;
    color:var(--gold-soft);
    cursor:pointer;
    font-family:Georgia,serif;
    text-transform:uppercase;
    font-size:13px;
    letter-spacing:.03em;
  }
  .tab-btn.active{background:var(--gold);color:#000;font-weight:700;}
  .stage-title{
    text-align:center;
    background:var(--gold);
    color:#000;
    font-family:Georgia,serif;
    font-weight:700;
    text-transform:uppercase;
    padding:8px 0;
    border-radius:6px;
    margin:22px 0 12px 0;
    font-size:14px;
    letter-spacing:.05em;
  }
  .match-card{
    background:var(--surface);
    border:1px solid var(--gold);
    border-radius:10px;
    padding:14px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .team-side{flex:1;text-align:center;min-width:0;}
  .team-side .flag{font-size:26px;}
  .team-side .name{
    font-family:Georgia,serif;
    font-weight:700;
    color:var(--gold-soft);
    font-size:14px;
    margin-top:4px;
    overflow-wrap:break-word;
  }
  .team-side .placeholder{
    width:36px;height:36px;border-radius:50%;
    background:#2a2a2a;color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto;font-size:16px;font-family:Georgia,serif;
  }
  .score-box{display:flex;align-items:center;gap:6px;}
  .score-box input{
    width:44px;text-align:center;padding:8px 4px;font-size:18px;font-family:Georgia,serif;font-weight:700;
  }
  .score-box .x{color:var(--gold);font-family:Georgia,serif;}
  .pens-row{display:flex;gap:6px;margin-top:8px;justify-content:center;flex-wrap:wrap;}
  .pens-btn{
    font-size:11px;padding:6px 10px;border-radius:14px;
    border:1px solid var(--gold-soft);color:var(--gold-soft);background:transparent;cursor:pointer;
  }
  .pens-btn.chosen{background:var(--gold-soft);color:#000;font-weight:700;}
  table{width:100%;border-collapse:collapse;margin-bottom:20px;border:1px solid var(--gold);border-radius:6px;overflow:hidden;}
  th{
    background:var(--surface);
    color:var(--gold);
    font-family:Georgia,serif;
    text-transform:uppercase;
    font-size:11px;
    padding:8px 4px;
    border-bottom:1px solid var(--gold);
  }
  td{
    text-align:center;
    padding:8px 4px;
    font-size:13px;
    border-top:1px solid var(--line);
  }
  td.tname{text-align:left;color:var(--gold-soft);font-weight:700;font-family:Georgia,serif;font-size:12px;}
  .champion-banner{
    text-align:center;background:var(--gold);color:#000;
    font-family:Georgia,serif;font-weight:700;text-transform:uppercase;
    padding:14px;border-radius:8px;margin-bottom:18px;font-size:15px;
  }
  .scorer-row{
    background:var(--surface);border:1px solid var(--gold);border-radius:10px;
    padding:10px 12px;margin-bottom:10px;
  }
  .scorer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .scorer-head .sname{font-family:Georgia,serif;font-weight:700;color:var(--gold-soft);font-size:15px;}
  .scorer-head .goals{color:var(--gold);font-family:Georgia,serif;font-weight:700;}
  .remove-x{color:var(--muted);background:none;border:none;font-size:16px;cursor:pointer;}
  .balls{display:flex;flex-wrap:wrap;gap:6px;}
  .ball{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;cursor:pointer;user-select:none;
    background:#2a2a2a;border:1px solid var(--line);
  }
  .ball.filled{background:#2e7d32;border-color:#4caf50;}
  .add-scorer-row{display:flex;gap:8px;margin-top:16px;}
  .add-scorer-row input{flex:1;}
  .footer-bar{
    margin-top:30px;border-top:1px solid var(--gold);padding-top:10px;
    text-align:center;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;
  }
  .hint{color:var(--muted);font-size:12px;text-align:center;margin:10px 0;}
  .reset-wrap{text-align:center;margin-top:24px;}
  .export-wrap{text-align:center;margin-bottom:16px;}

  .export-card{
    background:#000000;color:#fff;
    font-family:Calibri,Candara,'Segoe UI',Optima,Arial,sans-serif;
    padding:28px 22px;
  }
  .exp-cover{text-align:center;}
  .exp-logo{width:70px;height:auto;display:block;margin:0 auto 10px auto;}
  .exp-title{
    font-family:Georgia,'Times New Roman',serif;font-weight:700;color:#D4AF37;
    text-transform:uppercase;text-align:center;font-size:26px;
    border-bottom:1px solid #D4AF37;padding-bottom:12px;margin-bottom:16px;letter-spacing:.03em;
  }
  .exp-subtitle{font-size:12px;color:#E9C766;letter-spacing:.2em;margin-top:6px;}
  .exp-champion{
    text-align:center;background:#D4AF37;color:#000;font-family:Georgia,serif;font-weight:700;
    text-transform:uppercase;padding:14px;border-radius:8px;margin-bottom:18px;font-size:16px;line-height:1.5;
  }
  .exp-stage-label{
    text-align:center;background:#D4AF37;color:#000;font-family:Georgia,serif;font-weight:700;
    text-transform:uppercase;padding:7px 0;border-radius:6px;margin:18px 0 10px 0;font-size:13px;letter-spacing:.05em;
  }
  .exp-match{
    background:#141414;border:1px solid #D4AF37;border-radius:10px;padding:14px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;
  }
  .exp-team{flex:1;text-align:center;font-family:Georgia,serif;font-weight:700;color:#E9C766;font-size:13px;}
  .exp-score{font-family:Georgia,serif;font-weight:700;color:#D4AF37;font-size:20px;padding:0 8px;white-space:nowrap;}
  .exp-scorers{background:#141414;border:1px solid #D4AF37;border-radius:10px;padding:6px 12px;}
  .exp-scorer-row{
    display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #4A3F22;font-size:13px;
  }
  .exp-scorer-row:first-child{border-top:none;}
  .exp-sc-pos{color:#D4AF37;font-family:Georgia,serif;font-weight:700;width:18px;}
  .exp-sc-name{flex:1;color:#E9C766;font-family:Georgia,serif;font-weight:700;}
  .exp-sc-balls{letter-spacing:2px;}
  .exp-empty{color:#AFA99A;text-align:center;font-size:12px;padding:10px 0;}
  .exp-footer{
    margin-top:24px;border-top:1px solid #D4AF37;padding-top:10px;
    text-align:center;color:#AFA99A;font-size:10px;text-transform:uppercase;letter-spacing:.08em;
  }
</style>
</head>

  TEAMS_DB.forEach(g=>g.list.forEach(t=>out.push(t)));

let state = null;
const DEFAULT_STATE = ()=>({
  stage:'setup',
  tab:'jogos',
  cupName:'',
  numTeams:4,
  format:'grupos',
  teams:[],
  matches:[],
  scorers:[],
  koOverrides:{}
});

async function loadState(){
  try{
    const raw = localStorage.getItem('copaState');
    state = raw ? JSON.parse(raw) : DEFAULT_STATE();
  }catch(e){ state = DEFAULT_STATE(); }
  render();
}

async function saveState(){
  try{ localStorage.setItem('copaState', JSON.stringify(state)); }catch(e){ console.error(e); }
}

function setNumTeams(n){
  state.numTeams = n;
  if(n!==4) state.format = 'grupos';
  state.teams = new Array(n).fill(null).map((_,i)=> state.teams[i] || null);
  render(); saveState();
}

function setFormat(f){
  state.format = f;
  render(); saveState();
}

function setTeam(i, teamName){
  const t = flatTeams().find(x=>x.name===teamName);
  state.teams[i] = t ? {name:t.name, flag:t.flag} : null;
  saveState();
}

function roundRobinPairs(idxs){
  let pairs=[];
  for(let i=0;i<idxs.length;i++) for(let j=i+1;j<idxs.length;j++) pairs.push([idxs[i],idxs[j]]);
  return pairs;
}

// Método do círculo: cada time joga só 1x por rodada, garantindo descanso.
function circleRounds(idxs){
  let arr = idxs.slice();
  if(arr.length % 2 === 1) arr.push(null); // bye
  const n = arr.length;
  const rounds = [];
  for(let r=0; r<n-1; r++){
    const pairs = [];
    for(let i=0;i<n/2;i++){
      const a = arr[i], b = arr[n-1-i];
      if(a!=null && b!=null) pairs.push([a,b]);
    }
    rounds.push(pairs);
    const fixed = arr[0];
    const rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr = [fixed, ...rest];
  }
  return rounds;
}

function scheduledPairs(idxs){
  const rounds = circleRounds(idxs);
  let flat = [];
  rounds.forEach(rd => rd.forEach(p => flat.push(p)));
  return flat;
}

function generateMatches(n, format){
  let matches=[]; let mid=1;
  const idxs=[...Array(n).keys()];
  if(n===4 && format==='mata_mata'){
    matches.push({id:mid++, stage:'semi1', home:null, away:null, scoreHome:null, scoreAway:null, manual:true});
    matches.push({id:mid++, stage:'semi2', home:null, away:null, scoreHome:null, scoreAway:null, manual:true});
    matches.push({id:mid++, stage:'disputa3', home:null, away:null, scoreHome:null, scoreAway:null});
    matches.push({id:mid++, stage:'final', home:null, away:null, scoreHome:null, scoreAway:null});
  } else if(n===3){
    const turno = scheduledPairs(idxs);
    const returno = turno.map(([a,b])=>[b,a]);
    turno.forEach(([a,b])=>matches.push({id:mid++, stage:'grupo', home:a, away:b, scoreHome:null, scoreAway:null}));
    returno.forEach(([a,b])=>matches.push({id:mid++, stage:'grupo', home:a, away:b, scoreHome:null, scoreAway:null}));
    matches.push({id:mid++, stage:'final', home:null, away:null, scoreHome:null, scoreAway:null});
  } else if(n===4 || n===5){
    scheduledPairs(idxs).forEach(([a,b])=>matches.push({id:mid++, stage:'grupo', home:a, away:b, scoreHome:null, scoreAway:null}));
    matches.push({id:mid++, stage:'disputa3', home:null, away:null, scoreHome:null, scoreAway:null});
    matches.push({id:mid++, stage:'final', home:null, away:null, scoreHome:null, scoreAway:null});
  } else if(n===6){
    const groupA=[0,1,2], groupB=[3,4,5];
    scheduledPairs(groupA).forEach(([a,b])=>matches.push({id:mid++, stage:'grupoA', home:a, away:b, scoreHome:null, scoreAway:null}));
    scheduledPairs(groupB).forEach(([a,b])=>matches.push({id:mid++, stage:'grupoB', home:a, away:b, scoreHome:null, scoreAway:null}));
    matches.push({id:mid++, stage:'semi1', home:null, away:null, scoreHome:null, scoreAway:null});
    matches.push({id:mid++, stage:'semi2', home:null, away:null, scoreHome:null, scoreAway:null});
    matches.push({id:mid++, stage:'final', home:null, away:null, scoreHome:null, scoreAway:null});
  }
  return matches;
}


function startCup(){
  if(!state.cupName.trim()){ alert('Escreve o nome do aniversariante!'); return; }
  if(state.teams.some(t=>!t)){ alert('Escolhe todas as seleções antes de começar!'); return; }
  const names = state.teams.map(t=>t.name);
  if(new Set(names).size !== names.length){ alert('Tem seleção repetida! Escolhe seleções diferentes.'); return; }
  state.matches = generateMatches(state.numTeams, state.format);
  state.stage='jogos';
  state.tab='jogos';
  render(); saveState();
}

function computeStandings(teamIdxs, matchList){
  let table = teamIdxs.map(i=>({idx:i, name:state.teams[i].name, flag:state.teams[i].flag,
    pts:0,v:0,e:0,d:0,j:0,gp:0,gc:0,sg:0}));
  matchList.forEach(m=>{
    if(m.scoreHome==null || m.scoreAway==null) return;
    const h = table.find(t=>t.idx===m.home), a = table.find(t=>t.idx===m.away);
    if(!h||!a) return;
    h.j++; a.j++;
    h.gp+=m.scoreHome; h.gc+=m.scoreAway;
    a.gp+=m.scoreAway; a.gc+=m.scoreHome;
    if(m.scoreHome>m.scoreAway){h.pts+=3;h.v++;a.d++;}
    else if(m.scoreHome<m.scoreAway){a.pts+=3;a.v++;h.d++;}
    else {h.pts+=1;a.pts+=1;h.e++;a.e++;}
  });
  table.forEach(t=>t.sg=t.gp-t.gc);
  table.sort((x,y)=> y.pts-x.pts || y.sg-x.sg || y.gp-x.gp || x.name.localeCompare(y.name));
  return table;
}

function allPlayed(list){ return list.length>0 && list.every(m=>m.scoreHome!=null && m.scoreAway!=null); }

function getMatch(stage){ return state.matches.find(m=>m.stage===stage); }
function stageMatches(stage){ return state.matches.filter(m=>m.stage===stage); }

function winnerOf(m){
  if(!m || m.home==null || m.away==null) return null;
  if(m.scoreHome==null || m.scoreAway==null) return null;
  if(m.scoreHome>m.scoreAway) return m.home;
  if(m.scoreHome<m.scoreAway) return m.away;
  const ov = state.koOverrides[m.id];
  if(ov==='home') return m.home;
  if(ov==='away') return m.away;
  return null;
}

function loserOf(m){
  const w = winnerOf(m);
  if(w==null || !m) return null;
  return w===m.home ? m.away : m.home;
}

function updateKnockoutStages(){
  const n = state.numTeams;
  if(n===4 && state.format==='mata_mata'){
    const s1 = getMatch('semi1'), s2 = getMatch('semi2');
    const d3 = getMatch('disputa3'), fin = getMatch('final');
    const w1 = winnerOf(s1), w2 = winnerOf(s2);
    const l1 = loserOf(s1), l2 = loserOf(s2);
    if(d3 && d3.home==null && l1!=null && l2!=null){ d3.home = l1; d3.away = l2; }
    if(fin && fin.home==null && w1!=null && w2!=null){ fin.home = w1; fin.away = w2; }
  } else if(n===3){
    const grp = stageMatches('grupo');
    const fin = getMatch('final');
    if(fin && fin.home==null && allPlayed(grp)){
      const st = computeStandings([0,1,2], grp);
      fin.home = st[0].idx; fin.away = st[1].idx;
    }
  } else if(n===4 || n===5){
    const grp = stageMatches('grupo');
    const d3 = getMatch('disputa3'); const fin = getMatch('final');
    if(allPlayed(grp)){
      const st = computeStandings([...Array(n).keys()], grp);
      if(d3 && d3.home==null){ d3.home = st[2].idx; d3.away = st[3].idx; }
      if(fin && fin.home==null){ fin.home = st[0].idx; fin.away = st[1].idx; }
    }
  } else if(n===6){
    const gA = stageMatches('grupoA'), gB = stageMatches('grupoB');
    const s1 = getMatch('semi1'), s2 = getMatch('semi2'), fin = getMatch('final');
    if(allPlayed(gA) && allPlayed(gB)){
      const stA = computeStandings([0,1,2], gA);
      const stB = computeStandings([3,4,5], gB);
      if(s1 && s1.home==null){ s1.home = stA[0].idx; s1.away = stB[1].idx; }
      if(s2 && s2.home==null){ s2.home = stB[0].idx; s2.away = stA[1].idx; }
    }
    if(fin && fin.home==null){
      const w1 = winnerOf(s1), w2 = winnerOf(s2);
      if(w1!=null && w2!=null){ fin.home = w1; fin.away = w2; }
    }
  }
}

function setScore(matchId, side, val){
  const m = state.matches.find(x=>x.id===matchId);
  if(!m) return;
  const v = val===''? null : Math.max(0, parseInt(val,10)||0);
  if(side==='home') m.scoreHome = v; else m.scoreAway = v;
  delete state.koOverrides[matchId];
  render(); saveState();
}

function setPens(matchId, side){
  state.koOverrides[matchId] = side;
  render(); saveState();
}

function addScorer(){
  const input = document.getElementById('newScorerName');
  const name = input.value.trim();
  if(!name) return;
  state.scorers.push({name, goals:0});
  input.value='';
  render(); saveState();
}

function removeScorer(i){
  state.scorers.splice(i,1);
  render(); saveState();
}

function ballClick(i, idx){
  const s = state.scorers[i];
  if(idx < s.goals){
    if(idx === s.goals-1) s.goals -= 1;
  } else if(idx === s.goals){
    s.goals += 1;
  }
  render(); saveState();
}

let resetArmed = false;
function resetCup(){
  if(!resetArmed){
    resetArmed = true;
    render();
    setTimeout(()=>{ resetArmed=false; render(); }, 3000);
    return;
  }
  state = DEFAULT_STATE();
  resetArmed = false;
  render(); saveState();
}

function stageLabel(s){
  return {grupo:'Fase de Grupos', grupoA:'Grupo A', grupoB:'Grupo B',
    semi1:'Semifinal 1', semi2:'Semifinal 2', disputa3:'Disputa de 3º Lugar', final:'Final'}[s] || s;
}

function teamSlotHtml(idx){
  if(idx==null) return '<div class="placeholder">?</div>';
  const t = state.teams[idx];
  return '<div class="flag">'+t.flag+'</div><div class="name">'+t.name+'</div>';
}

function manualTeamSelectHtml(matchId, side, currentIdx){
  const opts = state.teams.map((t,i)=>
    '<option value="'+i+'" '+(currentIdx===i?'selected':'')+'>'+t.flag+' '+t.name+'</option>'
  ).join('');
  return '<select style="font-size:12px;padding:6px 4px;" onchange="setManualTeam('+matchId+',\''+side+'\',this.value)"><option value="">Escolher…</option>'+opts+'</select>';
}

function setManualTeam(matchId, side, val){
  const m = state.matches.find(x=>x.id===matchId);
  if(!m) return;
  const v = val===''? null : parseInt(val,10);
  if(side==='home') m.home = v; else m.away = v;
  render(); saveState();
}

function matchCardHtml(m, showPens){
  const showScore = m.home!=null && m.away!=null;
  const hv = m.scoreHome==null? '' : m.scoreHome;
  const av = m.scoreAway==null? '' : m.scoreAway;
  let pensHtml = '';
  if(showPens && showScore && m.scoreHome!=null && m.scoreAway!=null && m.scoreHome===m.scoreAway){
    const ov = state.koOverrides[m.id];
    pensHtml = '<div class="pens-row">'
      + '<button class="pens-btn '+(ov==='home'?'chosen':'')+'" onclick="setPens('+m.id+',\'home\')">Pênaltis: '+state.teams[m.home].name+'</button>'
      + '<button class="pens-btn '+(ov==='away'?'chosen':'')+'" onclick="setPens('+m.id+',\'away\')">Pênaltis: '+state.teams[m.away].name+'</button>'
      + '</div>';
  }
  const homeSlot = m.manual ? manualTeamSelectHtml(m.id,'home',m.home) : teamSlotHtml(m.home);
  const awaySlot = m.manual ? manualTeamSelectHtml(m.id,'away',m.away) : teamSlotHtml(m.away);
  return '<div>'
    + '<div class="match-card">'
    + '<div class="team-side">'+homeSlot+'</div>'
    + '<div class="score-box">'
    + (showScore
        ? '<input type="text" inputmode="numeric" pattern="[0-9]*" value="'+hv+'" oninput="setScore('+m.id+',\'home\',this.value)"><span class="x">x</span><input type="text" inputmode="numeric" pattern="[0-9]*" value="'+av+'" oninput="setScore('+m.id+',\'away\',this.value)">'
        : '<span class="x">x</span>')
    + '</div>'
    + '<div class="team-side">'+awaySlot+'</div>'
    + '</div>'
    + pensHtml
    + '</div>';
}

function standingsTableHtml(teamIdxs, matchList){
  const st = computeStandings(teamIdxs, matchList);
  let rows = st.map((t,i)=>
    '<tr><td>'+(i+1)+'</td><td class="tname">'+t.flag+' '+t.name+'</td><td>'+t.pts+'</td><td>'+t.j+'</td><td>'+t.v+'</td><td>'+t.e+'</td><td>'+t.d+'</td><td>'+t.gp+'</td><td>'+t.gc+'</td><td>'+t.sg+'</td></tr>'
  ).join('');
  return '<table><thead><tr><th>#</th><th>Seleção</th><th>Pts</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function renderSetup(){
  let teamSelects = '';
  const isSix = state.numTeams===6;
  const optionsHtml = (selected)=> TEAMS_DB.map(g=>
    '<optgroup label="'+g.c+'">'+g.list.map(t=>
      '<option value="'+t.name+'" '+(selected===t.name?'selected':'')+'>'+t.flag+' '+t.name+'</option>'
    ).join('')+'</optgroup>'
  ).join('');

  function slot(i){
    const sel = state.teams[i] ? state.teams[i].name : '';
    return '<select onchange="setTeam('+i+', this.value)"><option value="">Escolher seleção…</option>'+optionsHtml(sel)+'</select>';
  }

  if(isSix){
    teamSelects += '<div class="group-label">Grupo A</div>';
    for(let i=0;i<3;i++) teamSelects += '<div style="margin-top:8px">'+slot(i)+'</div>';
    teamSelects += '<div class="group-label">Grupo B</div>';
    for(let i=3;i<6;i++) teamSelects += '<div style="margin-top:8px">'+slot(i)+'</div>';
  } else {
    teamSelects += '<div class="group-label">Seleções</div>';
    for(let i=0;i<state.numTeams;i++) teamSelects += '<div style="margin-top:8px">'+slot(i)+'</div>';
  }

  const formatHint = {
    3:'3 times: cada dupla se enfrenta 2x (turno e returno) e depois final entre os 2 primeiros.',
    4: state.format==='mata_mata'
      ? '4 times: direto pro mata-mata — você escolhe os confrontos da semifinal, depois disputa de 3º e final.'
      : '4 times: todos contra todos 1x, depois disputa de 3º e final.',
    5:'5 times: todos contra todos 1x, depois disputa de 3º e final (o 5º colocado fica de fora da fase final).',
    6:'6 times: 2 grupos de 3 (todos contra todos dentro do grupo), depois semifinal e final — sem disputa de 3º.'
  }[state.numTeams];

  let formatChoice = '';
  if(state.numTeams===4){
    formatChoice = '<label>Formato</label>'
      + '<div class="team-count-row">'
      + '<div class="count-pill '+(state.format==='grupos'?'active':'')+'" onclick="setFormat(\'grupos\')" style="flex:1.3;font-size:12px;">Fase de grupos</div>'
      + '<div class="count-pill '+(state.format==='mata_mata'?'active':'')+'" onclick="setFormat(\'mata_mata\')" style="flex:1.3;font-size:12px;">Mata-mata direto</div>'
      + '</div>';
  }

  return ''
    + '<div class="cover">'
    + '<img class="logo" src="data:image/png;base64,'+LOGO_B64+'">'
    + '</div>'
    + '<h2 style="text-align:center;border-bottom:1px solid var(--gold);padding-bottom:8px;">Montar Copa</h2>'
    + '<label>Nome do aniversariante</label>'
    + '<input type="text" placeholder="Ex: Vicente" value="'+(state.cupName||'')+'" oninput="state.cupName=this.value; saveState();">'
    + '<label>Quantidade de times</label>'
    + '<div class="team-count-row">'
    + [3,4,5,6].map(n=>'<div class="count-pill '+(state.numTeams===n?'active':'')+'" onclick="setNumTeams('+n+')">'+n+'</div>').join('')
    + '</div>'
    + formatChoice
    + '<div class="hint">'+formatHint+'</div>'
    + teamSelects
    + '<button class="btn" onclick="startCup()">Começar Copa</button>';
}

function renderJogos(){
  const n = state.numTeams;
  updateKnockoutStages();
  let html = '';

  const finalMatch = getMatch('final');
  const champIdx = finalMatch ? winnerOf(finalMatch) : null;
  if(champIdx!=null){
    html += '<div class="champion-banner">🏆 Campeão: '+state.teams[champIdx].flag+' '+state.teams[champIdx].name+'</div>';
  }

  if(n===4 && state.format==='mata_mata'){
    html += '<div class="hint">Escolhe os confrontos da semifinal tocando nos nomes.</div>';
    html += '<div class="stage-title">Semifinal 1</div>';
    html += matchCardHtml(getMatch('semi1'), true);
    html += '<div class="stage-title">Semifinal 2</div>';
    html += matchCardHtml(getMatch('semi2'), true);
    html += '<div class="stage-title">Disputa de 3º Lugar</div>';
    html += matchCardHtml(getMatch('disputa3'), true);
    html += '<div class="stage-title">Final</div>';
    html += matchCardHtml(getMatch('final'), true);
  } else if(n===3){
    html += '<div class="stage-title">Fase de Grupos (turno e returno)</div>';
    stageMatches('grupo').forEach(m=> html += matchCardHtml(m,false));
    html += standingsTableHtml([0,1,2], stageMatches('grupo'));
    html += '<div class="stage-title">Final</div>';
    html += matchCardHtml(getMatch('final'), true);
  } else if(n===4 || n===5){
    html += '<div class="stage-title">Fase de Grupos</div>';
    stageMatches('grupo').forEach(m=> html += matchCardHtml(m,false));
    html += standingsTableHtml([...Array(n).keys()], stageMatches('grupo'));
    html += '<div class="stage-title">Disputa de 3º Lugar</div>';
    html += matchCardHtml(getMatch('disputa3'), true);
    html += '<div class="stage-title">Final</div>';
    html += matchCardHtml(getMatch('final'), true);
  } else if(n===6){
    html += '<div class="stage-title">Grupo A</div>';
    stageMatches('grupoA').forEach(m=> html += matchCardHtml(m,false));
    html += standingsTableHtml([0,1,2], stageMatches('grupoA'));
    html += '<div class="stage-title">Grupo B</div>';
    stageMatches('grupoB').forEach(m=> html += matchCardHtml(m,false));
    html += standingsTableHtml([3,4,5], stageMatches('grupoB'));
    html += '<div class="stage-title">Semifinal 1</div>';
    html += matchCardHtml(getMatch('semi1'), true);
    html += '<div class="stage-title">Semifinal 2</div>';
    html += matchCardHtml(getMatch('semi2'), true);
    html += '<div class="stage-title">Final</div>';
    html += matchCardHtml(getMatch('final'), true);
  }
  return html;
}

function renderArtilheiros(){
  const sorted = state.scorers.map((s,i)=>({...s, i})).sort((a,b)=> b.goals-a.goals || a.name.localeCompare(b.name));
  let html = '';
  if(sorted.length===0){
    html += '<div class="hint">Ainda não tem nenhum artilheiro. Adiciona o nome de quem fizer o primeiro gol!</div>';
  }
  sorted.forEach(s=>{
    const ballCount = Math.max(10, s.goals + 3);
    let balls = '';
    for(let b=0;b<ballCount;b++){
      balls += '<div class="ball '+(b<s.goals?'filled':'')+'" onclick="ballClick('+s.i+','+b+')">'+(b<s.goals?'⚽':'')+'</div>';
    }
    html += '<div class="scorer-row">'
      + '<div class="scorer-head"><span class="sname">'+s.name+'</span>'
      + '<span><span class="goals">'+s.goals+' gol'+(s.goals===1?'':'s')+'</span> '
      + '<button class="remove-x" onclick="removeScorer('+s.i+')">✕</button></span></div>'
      + '<div class="balls">'+balls+'</div>'
      + '</div>';
  });
  html += '<div class="add-scorer-row">'
    + '<input type="text" id="newScorerName" placeholder="Nome da criança">'
    + '<button class="btn small" onclick="addScorer()">+ Adicionar</button>'
    + '</div>';
  return html;
}

function expMatchHtml(m, label){
  if(!m) return '';
  const hv = m.scoreHome==null? '-' : m.scoreHome;
  const av = m.scoreAway==null? '-' : m.scoreAway;
  const hName = m.home!=null? state.teams[m.home].flag+' '+state.teams[m.home].name : '?';
  const aName = m.away!=null? state.teams[m.away].flag+' '+state.teams[m.away].name : '?';
  return '<div class="exp-stage-label">'+label+'</div>'
    + '<div class="exp-match"><div class="exp-team">'+hName+'</div><div class="exp-score">'+hv+' x '+av+'</div><div class="exp-team">'+aName+'</div></div>';
}

function buildExportSummary(){
  const n = state.numTeams;
  updateKnockoutStages();
  const finalMatch = getMatch('final');
  const champIdx = finalMatch ? winnerOf(finalMatch) : null;
  const champHtml = champIdx!=null
    ? '<div class="exp-champion">🏆 CAMPEÃO<br>'+state.teams[champIdx].flag+' '+state.teams[champIdx].name+'</div>'
    : '';

  let finalsHtml = '';
  if(n===4 && state.format==='mata_mata'){
    finalsHtml += expMatchHtml(getMatch('semi1'), 'SEMIFINAL 1');
    finalsHtml += expMatchHtml(getMatch('semi2'), 'SEMIFINAL 2');
    finalsHtml += expMatchHtml(getMatch('disputa3'), 'DISPUTA DE 3º LUGAR');
    finalsHtml += expMatchHtml(getMatch('final'), 'FINAL');
  } else if(n===3){
    finalsHtml += expMatchHtml(getMatch('final'), 'FINAL');
  } else if(n===4 || n===5){
    finalsHtml += expMatchHtml(getMatch('disputa3'), 'DISPUTA DE 3º LUGAR');
    finalsHtml += expMatchHtml(getMatch('final'), 'FINAL');
  } else if(n===6){
    finalsHtml += expMatchHtml(getMatch('semi1'), 'SEMIFINAL 1');
    finalsHtml += expMatchHtml(getMatch('semi2'), 'SEMIFINAL 2');
    finalsHtml += expMatchHtml(getMatch('final'), 'FINAL');
  }

  let classHtml = '';
  if(n===4 && state.format==='mata_mata'){
    // mata-mata direto não tem tabela de classificação
  } else if(n===6){
    classHtml += '<div class="exp-stage-label">GRUPO A</div>' + standingsTableHtml([0,1,2], stageMatches('grupoA'));
    classHtml += '<div class="exp-stage-label">GRUPO B</div>' + standingsTableHtml([3,4,5], stageMatches('grupoB'));
  } else {
    classHtml += '<div class="exp-stage-label">CLASSIFICAÇÃO</div>' + standingsTableHtml([...Array(n).keys()], stageMatches('grupo'));
  }

  const sortedScorers = [...state.scorers].sort((a,b)=> b.goals-a.goals || a.name.localeCompare(b.name));
  let scorersHtml = '<div class="exp-stage-label">ARTILHEIROS</div>';
  if(sortedScorers.length===0){
    scorersHtml += '<div class="exp-scorers"><div class="exp-empty">Nenhum artilheiro registrado.</div></div>';
  } else {
    scorersHtml += '<div class="exp-scorers">' + sortedScorers.map((s,i)=>{
      const balls = s.goals>0 ? '⚽'.repeat(s.goals) : '—';
      return '<div class="exp-scorer-row"><span class="exp-sc-pos">'+(i+1)+'</span><span class="exp-sc-name">'+s.name+'</span><span class="exp-sc-balls">'+balls+'</span></div>';
    }).join('') + '</div>';
  }

  return ''
    + '<div class="exp-cover"><img class="exp-logo" src="data:image/png;base64,'+LOGO_B64+'"></div>'
    + '<div class="exp-title">COPA DO '+(state.cupName||'').toUpperCase()+'<div class="exp-subtitle">2026</div></div>'
    + champHtml
    + finalsHtml
    + classHtml
    + scorersHtml;
}

async function renderExportCanvas(){
  const wrap = document.createElement('div');
  wrap.id = 'exportWrap';
  wrap.style.position = 'fixed';
  wrap.style.left = '-9999px';
  wrap.style.top = '0';
  wrap.style.width = '420px';
  wrap.className = 'export-card';
  wrap.innerHTML = buildExportSummary();
  document.body.appendChild(wrap);
  await new Promise(r=>setTimeout(r,60));
  const canvas = await html2canvas(wrap, {backgroundColor:'#000000', scale:2});
  document.body.removeChild(wrap);
  return canvas;
}

async function shareOrDownload(blob, fileName, mimeType, title){
  let shared = false;
  try{
    const file = new File([blob], fileName, {type:mimeType});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title});
      shared = true;
    }
  }catch(e){ /* fallback abaixo */ }
  if(!shared){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }
}

async function exportPDF(){
  const btn = document.getElementById('exportBtnPdf');
  if(btn){ btn.innerText = 'Gerando…'; btn.disabled = true; }
  try{
    const canvas = await renderExportCanvas();
    const { jsPDF } = window.jspdf;
    const pxToMm = px => px * 25.4 / 96;
    const wMm = pxToMm(canvas.width / 2);
    const hMm = pxToMm(canvas.height / 2);
    const doc = new jsPDF({ orientation: hMm>wMm?'portrait':'landscape', unit:'mm', format:[wMm, hMm] });
    doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, wMm, hMm);
    const fileName = 'Copa do '+(state.cupName||'copa').replace(/[^a-zA-Z0-9]+/g,'_')+'.pdf';
    const blob = doc.output('blob');
    await shareOrDownload(blob, fileName, 'application/pdf', 'Copa do '+(state.cupName||''));
  }catch(e){
    console.error(e);
    alert('Não consegui gerar o PDF. Tenta de novo.');
  }
  if(btn){ btn.innerText = '📄 Exportar em PDF'; btn.disabled = false; }
}

async function exportPNG(){
  const btn = document.getElementById('exportBtnPng');
  if(btn){ btn.innerText = 'Gerando…'; btn.disabled = true; }
  try{
    const canvas = await renderExportCanvas();
    const dataUrl = canvas.toDataURL('image/png');
    const blob = await (await fetch(dataUrl)).blob();
    const fileName = 'Copa do '+(state.cupName||'copa').replace(/[^a-zA-Z0-9]+/g,'_')+'.png';
    await shareOrDownload(blob, fileName, 'image/png', 'Copa do '+(state.cupName||''));
  }catch(e){
    console.error(e);
    alert('Não consegui gerar a imagem. Tenta de novo.');
  }
  if(btn){ btn.innerText = '📤 Exportar em PNG'; btn.disabled = false; }
}

function render(){
  const app = document.getElementById('app');
  if(state.stage==='setup'){
    app.innerHTML = renderSetup();
    return;
  }
  let html = ''
    + '<div class="cover">'
    + '<img class="logo" src="data:image/png;base64,'+LOGO_B64+'">'
    + '</div>'
    + '<div class="cup-title">COPA DO '+(state.cupName||'').toUpperCase()+'<small>2026</small></div>'
    + '<div class="tabs">'
    + '<div class="tab-btn '+(state.tab==='jogos'?'active':'')+'" onclick="state.tab=\'jogos\'; render();">Jogos</div>'
    + '<div class="tab-btn '+(state.tab==='artilheiros'?'active':'')+'" onclick="state.tab=\'artilheiros\'; render();">Artilheiros</div>'
    + '</div>'
    + '<div class="export-wrap">'
    + '<button id="exportBtnPdf" class="btn small" onclick="exportPDF()">📄 Exportar em PDF</button> '
    + '<button id="exportBtnPng" class="btn secondary small" onclick="exportPNG()">📤 PNG</button>'
    + '</div>';
  html += state.tab==='jogos' ? renderJogos() : renderArtilheiros();
  html += '<div class="reset-wrap"><button class="btn secondary small" onclick="resetCup()">'+(resetArmed?'Toca de novo pra confirmar':'⟲ Nova Copa')+'</button></div>';
  app.innerHTML = html;
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

loadState();
